name: Сообщить об ошибке
description: Помогите воспроизвести ошибку календаря
title: "[Ошибка] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Обращение публичное. Используйте тестовые суммы и не прикладывайте резервную копию с личными данными."
  - type: input
    id: version
    attributes:
      label: Версия приложения
      value: "0.1.1"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Устройство и браузер
      placeholder: "Например, Samsung A54, Android, Chrome"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Что вы сделали
      placeholder: "Опишите действия по порядку."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Какой результат ожидали
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Что получилось
      description: Можно добавить скриншот, предварительно скрыв личные данные.
    validations:
      required: true
